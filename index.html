<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070b" />
    <title>Oğluna BMW X3 Almak İster Misin?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <main id="ask-screen" class="screen">
      <p class="eyebrow">BMW X3</p>
      <h1>Oğluna BMW X3 Almak İster Misin?</h1>
      <div class="actions" id="actions">
        <button type="button" class="btn btn-yes" id="yes-btn">Evet</button>
        <button type="button" class="btn btn-no" id="no-btn" aria-label="Hayır">Hayır</button>
      </div>
    </main>

    <section id="yes-screen" class="screen yes-screen" hidden>
      <p class="eyebrow">Doğru karar</p>
      <h2>Kosifler Oto Bostancı</h2>
      <p class="address">İçerenköy Mah. Askent Sok. No:3B<br />Ataşehir / İstanbul</p>
      <a
        id="nav-card"
        class="nav-card"
        href="https://www.google.com/maps/dir/?api=1&destination=Kosifler+Oto+Bostanc%C4%B1+BMW+MINI+ve+BMW+Motorrad+Yetkili+Sat%C4%B1c%C4%B1s%C4%B1+ve+Yetkili+Servisi&destination_place_id=&travelmode=driving"
      >
        <img class="nav-photo" src="assets/kosifler-location.png" alt="Kosifler Oto Bostancı" />
        <img class="nav-map" src="assets/kosifler-map.png" alt="Kosifler Oto konum haritası" />
        <span class="nav-cta">Haritaya dokun, rotayı aç</span>
      </a>
    </section>

    <script src="js/app.js"></script>
  </body>
</html>
